name: Cron scheduling diagnostic

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report scheduling status
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          echo "Event: $EVENT_NAME"
          echo "Schedule: $SCHEDULE"
          echo "UTC now: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "### Cron diagnostic" >> "$GITHUB_STEP_SUMMARY"
          echo "Event: $EVENT_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "UTC now: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_STEP_SUMMARY"
