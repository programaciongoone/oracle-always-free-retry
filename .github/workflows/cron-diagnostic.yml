name: Oracle A1 schedule watchdog

on:
  schedule:
    - cron: '27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: read

concurrency:
  group: oracle-a1-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    if: ${{ vars.OCI_ENABLE_LAUNCH == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Dispatch Oracle only if overdue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking if a launch run was already scheduled in the current UTC hour"
          hour="$(date -u +%Y-%m-%dT%H)"
          existing="$(gh api "repos/${GH_REPO}/actions/workflows/oracle-a1.yml/runs?per_page=100" \
            --jq ".workflow_runs | map(select((.created_at | startswith(\"$hour\")) and (.display_title != \"Oracle A1 dry-run\"))) | length")"
          if (( existing > 0 )); then
            echo "Found ${existing} run(s) in UTC hour ${hour}; skipping duplicate dispatch."
            exit 0
          fi
          title="Oracle A1: solicitud de instancia aceptada"
          if gh issue list --repo "$GH_REPO" --state all --limit 100 --json title --jq '.[].title' | grep -Fxq "$title"; then
            echo "Oracle success notification issue already exists; no new dispatch."
            exit 0
          fi
          echo "Oracle workflow is overdue. Dispatching actual launch attempt."
          gh workflow run oracle-a1.yml --repo "$GH_REPO" --ref main -f dry_run=false
          echo "Submitted Oracle workflow_dispatch."
