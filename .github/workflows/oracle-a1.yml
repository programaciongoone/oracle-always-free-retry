name: Oracle A1 Always Free - Madrid

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simular sin crear instancia'
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  actions: write

concurrency:
  group: oracle-a1-free-tier-madrid
  cancel-in-progress: false

jobs:
  attempt:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.OCI_ENABLE_LAUNCH == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OCI SDK
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: One safe Oracle request
        id: oracle
        env:
          OCI_ENABLE_LAUNCH: ${{ vars.OCI_ENABLE_LAUNCH }}
          OCI_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY_B64: ${{ secrets.OCI_PRIVATE_KEY_B64 }}
          OCI_PRIVATE_KEY_PASSPHRASE: ${{ secrets.OCI_PRIVATE_KEY_PASSPHRASE }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_SUBNET_OCID: ${{ secrets.OCI_SUBNET_OCID }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          OCI_AVAILABILITY_DOMAIN: ${{ vars.OCI_AVAILABILITY_DOMAIN }}
          OCI_IMAGE_OCID: ${{ vars.OCI_IMAGE_OCID }}
        run: python oracle_a1.py
      - name: Disable schedule on success
        if: ${{ github.event_name == 'schedule' && (steps.oracle.outputs.result == 'created' || steps.oracle.outputs.result == 'already-exists') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/oracle-a1.yml/disable"
